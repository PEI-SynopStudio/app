# TLS for every HTTPS router (T4.36; MS2 NFR Security: TLS 1.3).
# TLS 1.2 is the minimum; Go picks TLS 1.3 whenever the browser supports it.
tls:
  options:
    default:
      minVersion: VersionTLS12
      # Only for TLS 1.2 connections; the TLS 1.3 suites are fixed and all strong.
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
  # Made by traefik/generate-dev-cert.sh and kept out of git; without it Traefik serves its own default certificate.
  stores:
    default:
      defaultCertificate:
        certFile: /certs/local.crt
        keyFile: /certs/local.key
