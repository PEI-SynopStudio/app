services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "[ -d node_modules/vite ] || npm ci; npm run dev -- --host 0.0.0.0"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://pei:pei@postgres:5432/pei}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://pei:pei@rabbitmq:5672/}
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-pei}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-pei}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
    volumes:
      - ./backend:/app
      - media_data:/data/media
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  ingestion-worker:
    build: ./backend
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://pei:pei@rabbitmq:5672/}
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-pei}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-pei}
    volumes:
      - ./backend:/app
      - media_data:/data/media
    command: python -m app.workers.ingestion_worker
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pei}
      POSTGRES_DB: ${POSTGRES_DB:-pei}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pei -d pei"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pei}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pei}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-pei}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-pei}
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    command: server -ip=seaweedfs -ip.bind=0.0.0.0 -filer -filer.encryptVolumeData -s3 -s3.encryptVolumeData
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  rabbitmq_data:
  seaweedfs_data:
  media_data:
  frontend_node_modules:
