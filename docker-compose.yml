services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "cmp -s package-lock.json node_modules/.installed-lock.json || (npm ci && cp package-lock.json node_modules/.installed-lock.json); npm run dev -- --host 0.0.0.0"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://pei:pei@postgres:5432/pei}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://pei:pei@rabbitmq:5672/}
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-pei}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-pei}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - ./backend:/app
      - media_data:/data/media
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  ingestion-worker:
    build: ./backend
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://pei:pei@rabbitmq:5672/}
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-pei}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-pei}
    volumes:
      - ./backend:/app
      - media_data:/data/media
    command: python -m app.workers.ingestion_worker
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pei}
      POSTGRES_DB: ${POSTGRES_DB:-pei}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pei -d pei"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pei}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pei}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-pei}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-pei}
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    command: server -ip=seaweedfs -ip.bind=0.0.0.0 -filer -filer.encryptVolumeData -s3 -s3.encryptVolumeData
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10


  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-pei}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-pei}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-pei-dev-client-secret}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    

volumes:
  postgres_data:
  rabbitmq_data:
  seaweedfs_data:
  media_data:
  frontend_node_modules:
